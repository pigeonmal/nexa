name: Nexa CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked

  ios-compile:
    name: iOS device SDK compile
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build Nexa CLI
        run: cargo build -p nexa-cli --locked
      - name: Generate and compile the iOS networking app
        shell: bash
        run: |
          project="$RUNNER_TEMP/nexa-ios-compile"
          target/debug/nexa create NetworkFetchSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/dev_network_fetch.nx" "$project/App.nx"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --ios

  android-compile:
    name: Android APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Build Nexa CLI
        run: cargo build -p nexa-cli --locked
      - name: Generate Android networking compile project
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android"
          target/debug/nexa create NetworkFetchSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/dev_network_fetch.nx" "$project/App.nx"
      - uses: gradle/actions/setup-gradle@v6
        # The Android project is generated into the ignored build/ directory;
        # the basic provider requires a Gradle build-file hash from tracked files.
        with:
          cache-provider: enhanced
      - name: Compile the native Android app
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --android
