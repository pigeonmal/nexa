name: Nexa CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-metadata:
    name: License metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check license metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, re, sys
          from pathlib import Path

          root = Path(".")
          failures = []

          def check(condition, message):
              if not condition:
                  failures.append(message)

          cargo = (root / "Cargo.toml").read_text()
          members = re.findall(r'"(crates/[^"]+)"', cargo.split("default-members")[0])
          check('license = "MPL-2.0"' in cargo, "workspace license must be MPL-2.0")
          check(bool(members), "workspace members must be listed")

          for member in members:
              manifest = (root / member / "Cargo.toml").read_text()
              check(
                  'license.workspace = true' in manifest or 'license = "MPL-2.0"' in manifest,
                  f"{member}/Cargo.toml must inherit the MPL-2.0 workspace license",
              )
              check(
                  not re.search(r'license\s*=\s*"(?!MPL-2\.0)', manifest),
                  f"{member}/Cargo.toml declares a non-MPL-2.0 license",
              )

          license_text = (root / "LICENSE").read_text()
          check("Mozilla Public License Version 2.0" in license_text, "LICENSE must be MPL-2.0")
          check("GENERAL PUBLIC LICENSE" not in license_text, "LICENSE must not be GPL text")

          readme = (root / "README.md").read_text()
          check("license-MPL--2.0" in readme, "README badge must say MPL-2.0")
          check("Mozilla Public License 2.0" in readme, "README license section must say MPL-2.0")
          check("license-MIT" not in readme, "README must not claim MIT")
          check("MIT License" not in readme, "README must not claim MIT")
          check("GPL" not in readme, "README must not claim GPL")
          check(
              f"all {len(members)} crates" in readme,
              f"README crate count must match the {len(members)} workspace members",
          )

          package_json = json.loads((root / "editors/vscode/package.json").read_text())
          check(
              package_json.get("license") == "MPL-2.0",
              "editors/vscode/package.json license must be MPL-2.0",
          )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print(f"license metadata consistent (MPL-2.0, {len(members)} crates)")
          EOF

  docs:
    name: Generated documentation is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      # The documentation tests render their tables from the parser catalog,
      # the IR icon catalog, the plugin manifests, and the CLI's own config
      # defaults. Running them without NEXA_UPDATE_SNAPSHOTS turns any drift
      # between those sources and the checked-in Markdown into a failure here
      # rather than in a contributor's next unrelated change.
      - name: Check generated documentation
        env:
          CARGO_TARGET_DIR: /tmp/nexa-verification-target
        run: cargo test --locked -p nexa-cli -p nexa-ir --test cache_audit --test plugin_reference --test project_config_reference --test language_reference --test system_icon_docs

  rust:
    name: Rust check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Test workspace
        run: NEXA_REQUIRE_HOT_RELOAD_COVERAGE=1 cargo test --workspace --locked

  ios-compile:
    name: iOS device SDK compile
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build Nexa CLI
        run: cargo build -p nexa-cli --locked
      - name: Generate and compile the iOS networking app
        shell: bash
        run: |
          project="$RUNNER_TEMP/nexa-ios-compile"
          target/debug/nexa create NetworkFetchSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/dev_network_fetch.nx" "$project/App.nx"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --ios
      - name: Compile the iOS hot-reload host
        working-directory: ${{ runner.temp }}/nexa-ios-compile
        run: $GITHUB_WORKSPACE/target/debug/nexa dev --ios --compile-only
      - name: Compile the iOS split-view release and DevRuntime hosts
        shell: bash
        run: |
          project="$RUNNER_TEMP/nexa-ios-split-view"
          target/debug/nexa create SplitViewRenderSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/examples/adaptive_workspace.nx" "$project/App.nx"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --ios
          "$GITHUB_WORKSPACE/target/debug/nexa" dev --ios --compile-only
      - name: Run the iOS hot-reload latency gate
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          print(next((device["udid"] for devices in data["devices"].values() for device in devices
                      if device.get("isAvailable", True) and device["name"].startswith("iPhone")), ""))
          ')
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone simulator was found" >&2
            exit 1
          fi
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          bash tests/hot-reload-latency.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" ios "$RUNNER_TEMP/nexa-ios-hot-reload-latency"
      - name: Run the iOS hot-reload component and state gate
        shell: bash
        run: |
          bash tests/hot-reload-components.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" ios "$RUNNER_TEMP/nexa-ios-hot-reload-components"
      - name: Run the iOS hot-reload FastList gate
        shell: bash
        run: |
          bash tests/hot-reload-fast-list.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" ios \
            "$RUNNER_TEMP/nexa-ios-hot-reload-fast-list" "$RUNNER_TEMP/nexa-ios-hot-reload-fast-list.log"
      - name: Prepare render parity screenshot comparison
        shell: bash
        run: |
          parity_venv="$RUNNER_TEMP/nexa-render-parity-venv"
          python3 -m venv "$parity_venv"
          "$parity_venv/bin/python" -m pip install -r "$GITHUB_WORKSPACE/tests/requirements-render-parity.txt"
          echo "$parity_venv/bin" >> "$GITHUB_PATH"
      - name: Compare iOS AOT and DevRuntime rendering
        shell: bash
        run: |
          bash tests/hot-reload-aot-parity.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" ios "$RUNNER_TEMP/nexa-ios-render-parity"

  android-compile:
    name: Android APK compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: |-
            platform-tools
            emulator
            platforms;android-35
            system-images;android-35;google_apis;x86_64
      - name: Build Nexa CLI
        run: cargo build -p nexa-cli --locked
      - name: Generate Android networking compile project
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android"
          target/debug/nexa create NetworkFetchSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/dev_network_fetch.nx" "$project/App.nx"
      - uses: gradle/actions/setup-gradle@v6
        # The Android project is generated into the ignored build/ directory;
        # the basic provider requires a Gradle build-file hash from tracked files.
        with:
          cache-provider: enhanced
      - name: Compile the native Android app
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --android
      - name: Compile the Android hot-reload host
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" dev --android --compile-only
      - name: Compile the Android split-view release and DevRuntime hosts
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/build/ci-android-split-view"
          target/debug/nexa create SplitViewRenderSmoke --directory "$project"
          cp "$GITHUB_WORKSPACE/examples/adaptive_workspace.nx" "$project/App.nx"
          cd "$project"
          "$GITHUB_WORKSPACE/target/debug/nexa" test --android
          "$GITHUB_WORKSPACE/target/debug/nexa" dev --android --compile-only
      - name: Start Android emulator
        shell: bash
        run: |
          echo no | avdmanager create avd --force --name nexa-ci \
            --package 'system-images;android-35;google_apis;x86_64'
          emulator -avd nexa-ci -no-window -no-audio -no-boot-anim \
            -no-snapshot-save -gpu swiftshader_indirect >"$RUNNER_TEMP/nexa-emulator.log" 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 300); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              adb shell input keyevent 82 >/dev/null 2>&1 || true
              # Give the exhaustive component accessibility fixture enough
              # vertical space on AVDs that default to a tiny 320x640 display.
              adb shell wm size 800x1800
              adb shell wm density 160
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nexa-emulator.log" >&2
          echo "Android emulator did not finish booting" >&2
          exit 1
      - name: Run the Android hot-reload latency gate
        shell: bash
        run: |
          bash tests/hot-reload-latency.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" android "$RUNNER_TEMP/nexa-android-hot-reload-latency"
      - name: Run the Android hot-reload component and state gate
        shell: bash
        run: |
          bash tests/hot-reload-components.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" android "$RUNNER_TEMP/nexa-android-hot-reload-components"
      - name: Run the Android hot-reload FastList gate
        shell: bash
        run: |
          bash tests/hot-reload-fast-list.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" android \
            "$RUNNER_TEMP/nexa-android-hot-reload-fast-list" "$RUNNER_TEMP/nexa-android-hot-reload-fast-list.log"
      - name: Prepare render parity screenshot comparison
        shell: bash
        run: |
          parity_venv="$RUNNER_TEMP/nexa-render-parity-venv"
          python3 -m venv "$parity_venv"
          "$parity_venv/bin/python" -m pip install -r "$GITHUB_WORKSPACE/tests/requirements-render-parity.txt"
          echo "$parity_venv/bin" >> "$GITHUB_PATH"
      - name: Compare Android AOT and DevRuntime rendering
        shell: bash
        run: |
          bash tests/hot-reload-aot-parity.sh \
            "$GITHUB_WORKSPACE/target/debug/nexa" android "$RUNNER_TEMP/nexa-android-render-parity"
